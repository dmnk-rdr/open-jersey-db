design_en: "Black base tone, inspired by the vibrant colours of Chicha culture (a traditional Peruvian drink dating back to roughly 5000 BCE); three accent tones — coral, lemon and light maroon — feature on both the Trefoil logo and the three adidas stripes in a tricolour treatment. Matching black shorts with coordinated striping and black socks with accent stripes complete the kit."
