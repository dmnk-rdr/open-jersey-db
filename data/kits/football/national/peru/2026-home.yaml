design: >-
  Weißer Grundton mit Perus traditioneller roter Schärpe ("Sash"), hier nicht
  gerade, sondern mit modernen Kanten und Knicken; darin feine geometrische
  Linienmuster, die die drei Landschaftszonen Perus symbolisieren - Küste,
  Hochland und Regenwald. EQT-Kragen, schwarzes adidas-Logo und FPF-Wappen
  mittig auf der Brust, Schriftzug "Perú" unter dem Nackenkragen.
  adidas-Climacool-Technologie.
design_en: "White base tone with Peru's traditional red sash — not straight but with modern edges and twists — featuring fine geometric line patterns symbolising the country's three landscape zones: coastline, highlands and rainforest. EQT collar, black adidas logo and FPF crest centred on the chest, \"Perú\" lettering below the back collar. adidas Climacool technology."
